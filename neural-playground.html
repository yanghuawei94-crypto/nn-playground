<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="神经网络游乐场：在浏览器里搭神经网络、调参数、一键训练，实时观察分类边界与损失曲线，零门槛理解深度学习。">
<title>神经网络游乐场 - 浏览器里的深度学习实验室</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🧠</text></svg>">
<style>
  :root{
    --blue:#4f7cff; --orange:#ff8a3d; --bg:#f4f6fb; --card:#ffffff;
    --ink:#1f2430; --sub:#6b7280; --line:#e6e9f2; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink);}

  /* ===== 顶部控制栏（对齐原版布局） ===== */
  .topbar{background:var(--card); border-bottom:1px solid var(--line); padding:10px 22px;
          display:flex; align-items:center; gap:22px; flex-wrap:wrap; box-shadow:0 1px 4px rgba(20,30,60,.05);}
  .tb-btns{display:flex; gap:8px; align-items:center;}
  .tb-btn{width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; font-size:16px;
          background:#eef1f8; color:var(--ink); display:flex; align-items:center; justify-content:center; transition:.15s;}
  .tb-btn:hover{background:#e2e7f5;}
  #playBtn{background:var(--blue); color:#fff;}
  #playBtn.pause{background:var(--orange);}
  .tb-item{display:flex; flex-direction:column; gap:2px;}
  .tb-item label{font-size:11px; color:var(--sub);}
  .tb-item select{border:none; background:transparent; font-size:14px; font-weight:600; color:var(--ink);
                  cursor:pointer; border-bottom:1px dashed #cbd2e3; padding-bottom:1px;}
  .tb-epoch{font-size:14px; font-weight:600; font-variant-numeric:tabular-nums;}
  .tb-title{margin-left:auto; font-size:15px; color:var(--sub); display:flex; align-items:center; gap:10px;}
  .tb-title a{color:var(--blue); font-size:12px; text-decoration:none;}
  .tb-title a:hover{text-decoration:underline;}

  /* ===== 四列主布局：数据 | 特征 | 隐藏层+网络 | 输出 ===== */
  .app{display:grid; grid-template-columns:225px 215px 1fr 305px; gap:14px; padding:16px 22px 22px;}
  .col-title{font-size:12px; color:var(--sub); letter-spacing:1px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:baseline;}
  .col-title b{font-size:14px; color:var(--ink); letter-spacing:0;}
  .col-sub{font-size:11px; color:var(--sub); margin-bottom:12px; line-height:1.5;}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:0 1px 4px rgba(20,30,60,.06); padding:14px;}

  /* 数据列 */
  .ds-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .ds-btn{border:2px solid var(--line); border-radius:10px; padding:5px; cursor:pointer; background:#fff; transition:.15s;}
  .ds-btn:hover{border-color:#c3cdfc;}
  .ds-btn.active{border-color:var(--blue); box-shadow:0 0 0 3px rgba(79,124,255,.15);}
  .ds-btn canvas{display:block; width:100%; height:auto; border-radius:6px;}
  .ds-btn span{display:block; text-align:center; font-size:11px; color:var(--sub); margin-top:2px;}
  .ctl{margin-top:14px;}
  .ctl label{font-size:12px; color:var(--sub); display:flex; justify-content:space-between;}
  .ctl label b{color:var(--ink); font-variant-numeric:tabular-nums;}
  input[type=range]{width:100%; accent-color:var(--blue); margin-top:4px;}
  #regenBtn{width:100%; margin-top:14px; padding:7px; border:1px solid var(--line); border-radius:9px;
            background:#fff; color:var(--sub); cursor:pointer; font-size:12px;}
  #regenBtn:hover{border-color:var(--blue); color:var(--blue);}

  /* 特征列：渐变方块（对齐原版） */
  .feat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
  .feat{position:relative; border:2px solid var(--line); border-radius:9px; cursor:pointer; overflow:hidden;
        background:#fff; transition:.15s; opacity:.45;}
  .feat:hover{border-color:#c3cdfc; opacity:.8;}
  .feat.active{border-color:var(--blue); opacity:1;}
  .feat canvas{display:block; width:100%; height:auto;}
  .feat span{position:absolute; left:0; right:0; bottom:0; text-align:center; font-size:10px;
             background:rgba(255,255,255,.82); color:var(--ink); padding:1px 0;}
  .feat .pm{position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:50%;
            background:rgba(31,36,48,.55); color:#fff; font-size:12px; line-height:16px; text-align:center;}

  /* 隐藏层 + 网络 */
  .layers-bar{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; margin-bottom:10px;}
  #addLayer{width:34px; height:34px; border-radius:9px; border:1.5px dashed var(--line); background:#fff;
            color:var(--sub); cursor:pointer; font-size:17px;}
  #addLayer:hover{border-color:var(--blue); color:var(--blue);}
  .hlayer{border:1.5px solid var(--line); border-radius:9px; padding:5px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; background:#fff;}
  .hlayer .n{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums;}
  .hlayer .rowb{display:flex; gap:4px;}
  .pm2{width:20px; height:20px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:12px; line-height:1;}
  .pm2:hover{border-color:var(--blue); color:var(--blue);}
  .pm2.del{color:#c33;}
  #netCanvas{width:100%; height:430px; display:block;}
  .hint{margin-top:8px; font-size:11px; color:var(--sub); line-height:1.6;}
  .hint code{background:#eef1f8; padding:1px 5px; border-radius:5px; font-size:10px;}

  /* 输出列 */
  .loss-line{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;}
  .loss-line b{font-variant-numeric:tabular-nums;}
  #outCanvas{width:100%; border-radius:10px; border:1px solid var(--line); display:block; margin-top:8px;}
  .legend{display:flex; justify-content:space-between; font-size:11px; color:var(--sub); margin-top:6px;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px;}
  .checks{display:flex; gap:14px; margin-top:10px; font-size:12px; color:var(--sub);}
  .checks label{display:flex; align-items:center; gap:5px; cursor:pointer;}
  .checks input{accent-color:var(--blue);}
  #lossCanvas{width:100%; height:96px; display:block; margin-top:10px;}
  .loss-legend{font-size:11px; color:var(--sub); margin-top:4px;}
  .sw{display:inline-block; width:13px; height:3px; border-radius:2px; vertical-align:middle; margin:0 4px 2px 8px;}

  /* 扩展功能（回放/导出） */
  .extras{margin-top:14px; border-top:1px solid var(--line); padding-top:12px;}
  .extras h4{font-size:12px; color:var(--sub); letter-spacing:1px; margin-bottom:8px;}
  .xbtns{display:flex; gap:8px;}
  .xbtns button{flex:1; padding:7px 0; border-radius:9px; border:none; background:#eef1f8; color:var(--ink); cursor:pointer; font-size:12px;}
  .xbtns button:hover{background:#e2e7f5;}
  #replayInfo{font-size:10px; color:var(--sub); text-align:center; margin-top:6px;}

  @media (max-width:1180px){ .app{grid-template-columns:1fr 1fr;} }
  @media (max-width:720px){ .app{grid-template-columns:1fr;} #netCanvas{height:320px;} }
</style>
</head>
<body>

<!-- ===== 顶部控制栏 ===== -->
<div class="topbar">
  <div class="tb-btns">
    <button class="tb-btn" id="resetBtn" title="重置网络">⟳</button>
    <button class="tb-btn" id="playBtn" title="训练 / 暂停">▶</button>
  </div>
  <div class="tb-item"><label>迭代轮次</label><span class="tb-epoch" id="epoch">0</span></div>
  <div class="tb-item"><label>学习率</label>
    <select id="lr">
      <option value="0.0001">0.0001</option><option value="0.001">0.001</option>
      <option value="0.003">0.003</option><option value="0.01">0.01</option>
      <option value="0.03" selected>0.03</option><option value="0.1">0.1</option>
      <option value="0.3">0.3</option><option value="1">1</option>
    </select>
  </div>
  <div class="tb-item"><label>激活函数</label>
    <select id="act">
      <option value="tanh" selected>Tanh</option><option value="relu">ReLU</option>
      <option value="sigmoid">Sigmoid</option>
    </select>
  </div>
  <div class="tb-item"><label>正则化</label>
    <select id="reg">
      <option value="none" selected>无</option><option value="l1">L1</option><option value="l2">L2</option>
    </select>
  </div>
  <div class="tb-item"><label>正则化强度</label>
    <select id="regRate">
      <option value="0" selected>0</option><option value="0.001">0.001</option>
      <option value="0.003">0.003</option><option value="0.01">0.01</option>
      <option value="0.03">0.03</option><option value="0.1">0.1</option>
    </select>
  </div>
  <div class="tb-item"><label>问题类型</label>
    <select id="problem">
      <option value="classification" selected>分类</option><option value="regression">回归</option>
    </select>
  </div>
  <div class="tb-title">🧠 神经网络游乐场 <a href="digits.html">手写数字识别 →</a></div>
</div>

<div class="app">
  <!-- ===== 第 1 列：数据 ===== -->
  <div class="card">
    <div class="col-title"><b>数据</b></div>
    <div class="col-sub">想分类哪个数据集？</div>
    <div class="ds-grid" id="dsGrid"></div>
    <div class="ctl"><label>噪声 <b id="noiseVal">0</b></label>
      <input type="range" id="noise" min="0" max="50" value="0"></div>
    <div class="ctl"><label>批大小 <b id="batchVal">10</b></label>
      <input type="range" id="batch" min="1" max="30" value="10"></div>
    <div class="ctl"><label>训练/测试比例 <b id="ratioVal">50%</b></label>
      <input type="range" id="ratio" min="10" max="90" value="50"></div>
    <button id="regenBtn">⟳ 重新生成数据</button>
  </div>

  <!-- ===== 第 2 列：特征 ===== -->
  <div class="card">
    <div class="col-title"><b>特征</b><span id="featCnt"></span></div>
    <div class="col-sub">想喂入哪些属性？（点击方块添加/移除）</div>
    <div class="feat-grid" id="featGrid"></div>
  </div>

  <!-- ===== 第 3 列：隐藏层 + 网络 ===== -->
  <div class="card">
    <div class="col-title"><b><span id="hlCnt">2</span> 个隐藏层</b><span style="font-size:11px">连线粗细 = 权重大小，蓝正橙负</span></div>
    <div class="layers-bar">
      <button id="addLayer" title="添加隐藏层">＋</button>
      <div id="layersBox" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
    </div>
    <canvas id="netCanvas"></canvas>
    <p class="hint">💡 试试：<code>异或</code> + 2 层 <code>(4,2)</code> + <code>ReLU</code>；<code>螺旋</code> + 3 层 <code>(6,5,4)</code> + 学习率 0.1；<code>高斯</code> 不加隐藏层也能分。加噪声后开 L2 正则化可看过拟合被抑制。</p>
  </div>

  <!-- ===== 第 4 列：输出 ===== -->
  <div class="card">
    <div class="col-title"><b>输出</b></div>
    <div class="loss-line"><span style="color:var(--sub)">测试损失</span><b id="testLoss" style="color:var(--orange)">-</b></div>
    <div class="loss-line"><span style="color:var(--sub)">训练损失</span><b id="trainLoss" style="color:var(--blue)">-</b></div>
    <canvas id="outCanvas" width="560" height="560"></canvas>
    <div class="legend">
      <span><i class="dot" style="background:var(--blue)"></i>类别 A</span>
      <span>背景 = 网络预测</span>
      <span><i class="dot" style="background:var(--orange)"></i>类别 B</span>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="showTest" checked> 显示测试数据</label>
      <label><input type="checkbox" id="discretize"> 离散化输出</label>
    </div>
    <canvas id="lossCanvas"></canvas>
    <div class="loss-legend">损失曲线<i class="sw" style="background:var(--blue)"></i>训练<i class="sw" style="background:var(--orange)"></i>测试</div>

    <div class="extras">
      <h4>回放（训练中自动录屏）</h4>
      <div class="xbtns"><button id="replayBtn">▶ 回放训练过程</button></div>
      <input type="range" id="replaySlider" min="0" max="0" value="0" disabled style="margin-top:8px;">
      <div id="replayInfo">每 20 轮存一帧</div>
      <h4 style="margin-top:12px;">模型</h4>
      <div class="xbtns">
        <button id="exportBtn">导出模型</button>
        <button id="shareBtn">分享链接</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= 基础配置 ================= */
const DOMAIN = 6, N_POINTS = 400, GRID = 72;

const FEATS = {
  x1:  {label:'x₁',     f:(x,y)=>x/DOMAIN},
  x2:  {label:'x₂',     f:(x,y)=>y/DOMAIN},
  x1x2:{label:'x₁x₂',   f:(x,y)=>x*y/(DOMAIN*DOMAIN)},
  x1sq:{label:'x₁²',    f:(x,y)=>x*x/(DOMAIN*DOMAIN)},
  x2sq:{label:'x₂²',    f:(x,y)=>y*y/(DOMAIN*DOMAIN)},
  sinx:{label:'sin x₁', f:(x,y)=>Math.sin(x)},
  siny:{label:'sin x₂', f:(x,y)=>Math.sin(y)},
};
const ACTS = {
  tanh:    {f:x=>Math.tanh(x),  d:a=>1-a*a},
  relu:    {f:x=>x>0?x:0,       d:a=>a>0?1:0},
  sigmoid: {f:x=>1/(1+Math.exp(-x)), d:a=>a*(1-a)},
};
const sig = x=>1/(1+Math.exp(-x));

const state = {
  dataset:'circle', noise:0, ratio:0.5, batch:10,
  features:['x1','x2'], hidden:[4,2], act:'tanh',
  lr:0.03, reg:'none', regRate:0, problem:'classification',
  showTest:true, discretize:false,
  playing:false, epoch:0,
  train:[], test:[], W:[], b:[], trainHist:[], testHist:[],
};

const rnd = ()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};

/* ================= 数据集 ================= */
const DATAS = {
  circle:{name:'圆形', gen() {
    if (Math.random()<0.5) return {x:rnd()*1.2, y:rnd()*1.2, y0:0};
    const a=Math.random()*2*Math.PI, r=3.8+rnd()*0.6;
    return {x:r*Math.cos(a), y:r*Math.sin(a), y0:1};
  }},
  xor:{name:'异或', gen() {
    const cx=(Math.random()<0.5?-3:3), cy=(Math.random()<0.5?-3:3);
    return {x:cx+rnd()*1.1, y:cy+rnd()*1.1, y0:(cx*cy>0)?0:1};
  }},
  gauss:{name:'高斯', gen() {
    return Math.random()<0.5?{x:-2.4+rnd()*1.4, y:-2.4+rnd()*1.4, y0:0}
                            :{x: 2.4+rnd()*1.4, y: 2.4+rnd()*1.4, y0:1};
  }},
  spiral:{name:'螺旋', gen() {
    const t=Math.random()*Math.PI*2.4, cls=Math.random()<0.5?0:1;
    const ang=t+cls*Math.PI, r=t*0.72;
    return {x:r*Math.cos(ang)+rnd()*0.35, y:r*Math.sin(ang)+rnd()*0.35, y0:cls};
  }},
};

function genData(){
  const pts=[];
  for(let i=0;i<N_POINTS;i++){
    const p=DATAS[state.dataset].gen();
    const n=state.noise/50*1.5;
    p.x+=rnd()*n; p.y+=rnd()*n;
    pts.push(p);
  }
  for(let i=pts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pts[i],pts[j]]=[pts[j],pts[i]];}
  const k=Math.round(pts.length*state.ratio);
  state.train=pts.slice(0,k); state.test=pts.slice(k);
  state.epoch=0; state.trainHist=[]; state.testHist=[];
  clearFrames();
}

/* ================= 网络 ================= */
function featVec(x,y){ return state.features.map(k=>FEATS[k].f(x,y)); }
const isReg = ()=>state.problem==='regression';

function resetNetwork(){
  const sizes=[state.features.length, ...state.hidden, 1];
  state.W=[]; state.b=[];
  for(let l=0;l<sizes.length-1;l++){
    const s=Math.sqrt(2/sizes[l]);
    state.W.push(Array.from({length:sizes[l+1]},()=>Array.from({length:sizes[l]},()=>rnd()*s)));
    state.b.push(new Array(sizes[l+1]).fill(0));
  }
  state.epoch=0; state.trainHist=[]; state.testHist=[];
}

function forward(inp){
  const a=[inp];
  for(let l=0;l<state.W.length;l++){
    const prev=a[l], zl=[], isOut=l===state.W.length-1;
    for(let j=0;j<state.W[l].length;j++){
      let s=state.b[l][j];
      for(let i=0;i<prev.length;i++) s+=state.W[l][j][i]*prev[i];
      zl.push(s);
    }
    a.push(isOut ? (isReg()? zl.slice() : zl.map(sig)) : zl.map(ACTS[state.act].f));
  }
  return a;
}

function trainStep(){
  const L=state.W.length, m=state.batch;
  const gW=state.W.map(M=>M.map(r=>r.fill(0))), gb=state.b.map(v=>v.fill(0));
  for(let s=0;s<m;s++){
    const p=state.train[Math.floor(Math.random()*state.train.length)];
    const a=forward(featVec(p.x,p.y));
    let delta=[a[L][0]-p.y0];   // sigmoid+BCE 或 线性+MSE，输出层 delta 都是 a-y
    for(let l=L-1;l>=0;l--){
      for(let j=0;j<delta.length;j++){
        gb[l][j]+=delta[j];
        for(let i=0;i<a[l].length;i++) gW[l][j][i]+=delta[j]*a[l][i];
      }
      if(l>0){
        const dn=new Array(state.W[l-1].length).fill(0);
        for(let i=0;i<dn.length;i++){
          let s=0; for(let j=0;j<delta.length;j++) s+=state.W[l][j][i]*delta[j];
          dn[i]=s*ACTS[state.act].d(a[l][i]);
        }
        delta=dn;
      }
    }
  }
  const lr=state.lr/m;
  for(let l=0;l<L;l++)
    for(let j=0;j<state.W[l].length;j++){
      state.b[l][j]-=lr*gb[l][j];
      for(let i=0;i<state.W[l][j].length;i++){
        let g=gW[l][j][i];
        // 正则化
        if(state.reg==='l2') g+=state.regRate*state.W[l][j][i]*m;
        else if(state.reg==='l1') g+=state.regRate*Math.sign(state.W[l][j][i])*m;
        state.W[l][j][i]-=lr*g;
      }
    }
  state.epoch++;
}

function lossOf(set){
  if(!set.length) return 0;
  let s=0;
  for(const p of set){
    const o=forward(featVec(p.x,p.y)).at(-1)[0];
    if(isReg()){ const d=o-p.y0; s+=d*d/2; }
    else { const e=1e-9; s+=-(p.y0*Math.log(o+e)+(1-p.y0)*Math.log(1-o+e)); }
  }
  return s/set.length;
}

/* ================= 颜色 ================= */
const C_BLUE=[79,124,255], C_ORANGE=[255,138,61];

/* ================= 输出画布 ================= */
const outCv=document.getElementById('outCanvas'), octx=outCv.getContext('2d');
const off=document.createElement('canvas'); off.width=GRID; off.height=GRID;
const offCtx=off.getContext('2d');

function renderBoundary(target){
  const img=target.createImageData(GRID,GRID);
  for(let gy=0;gy<GRID;gy++)for(let gx=0;gx<GRID;gx++){
    const x=(gx/(GRID-1))*2*DOMAIN-DOMAIN, y=DOMAIN-(gy/(GRID-1))*2*DOMAIN;
    let p=forward(featVec(x,y)).at(-1)[0];
    p=Math.max(0,Math.min(1,p));
    let c;
    if(state.discretize){ c=p<0.5?C_ORANGE:C_BLUE; }
    else{
      const t=Math.min(1,Math.abs(p-0.5)*2), base=p<0.5?C_ORANGE:C_BLUE;
      c=base.map(v=>Math.round(255+(v-255)*t));
    }
    const o=(gy*GRID+gx)*4;
    img.data[o]=c[0]; img.data[o+1]=c[1]; img.data[o+2]=c[2]; img.data[o+3]=255;
  }
  return img;
}

function drawPoints(ctx, size){
  const S2=v=>(v+DOMAIN)/(2*DOMAIN)*size;
  const sets=[[state.train,false]];
  if(state.showTest) sets.push([state.test,true]);
  for(const [set,isTest] of sets)
    for(const p of set){
      ctx.beginPath();
      ctx.arc(S2(p.x),size-S2(p.y),isTest?4.5:3.5,0,7);
      ctx.fillStyle=p.y0?`rgb(${C_ORANGE})`:`rgb(${C_BLUE})`;
      ctx.fill();
      if(isTest){ctx.lineWidth=1.5; ctx.strokeStyle='#fff'; ctx.stroke();}
    }
}

function drawOutput(){
  offCtx.putImageData(renderBoundary(offCtx),0,0);
  octx.imageSmoothingEnabled=true;
  octx.drawImage(off,0,0,outCv.width,outCv.height);
  drawPoints(octx, outCv.width);
}

/* ================= 网络结构画布 ================= */
const netCv=document.getElementById('netCanvas'), nctx=netCv.getContext('2d');
function drawNetwork(){
  const dpr=window.devicePixelRatio||1;
  const w=netCv.clientWidth, h=netCv.clientHeight;
  if(netCv.width!==Math.round(w*dpr)){netCv.width=w*dpr; netCv.height=h*dpr;}
  nctx.setTransform(dpr,0,0,dpr,0,0);
  nctx.clearRect(0,0,w,h);
  const sizes=[state.features.length,...state.hidden,1];
  const pos=[], gapX=w/(sizes.length+1);
  for(let l=0;l<sizes.length;l++){
    const gapY=h/(sizes[l]+1), col=[];
    for(let j=0;j<sizes[l];j++) col.push({x:gapX*(l+1), y:gapY*(j+1)});
    pos.push(col);
  }
  for(let l=0;l<state.W.length;l++)
    for(let j=0;j<state.W[l].length;j++)
      for(let i=0;i<state.W[l][j].length;i++){
        const wv=state.W[l][j][i];
        nctx.beginPath();
        nctx.moveTo(pos[l][i].x,pos[l][i].y);
        nctx.lineTo(pos[l+1][j].x,pos[l+1][j].y);
        nctx.lineWidth=1+Math.min(6,Math.abs(wv)*2.5);
        nctx.strokeStyle=wv>0?`rgba(79,124,255,${Math.min(.85,Math.abs(wv)/1.5+.06)})`
                              :`rgba(255,138,61,${Math.min(.85,Math.abs(wv)/1.5+.06)})`;
        nctx.stroke();
      }
  const L=pos.length;
  pos.forEach((col,l)=>col.forEach((p,j)=>{
    nctx.beginPath(); nctx.arc(p.x,p.y,15,0,7);
    nctx.fillStyle='#fff'; nctx.fill();
    nctx.lineWidth=2;
    nctx.strokeStyle=l===0?'#94a3b8':(l===L-1?'#1f2430':'#4f7cff');
    nctx.stroke();
    nctx.fillStyle=l===L-1?'#1f2430':'#6b7280';
    nctx.font='10px sans-serif'; nctx.textAlign='center';
    if(l===0) nctx.fillText(FEATS[state.features[j]].label,p.x,p.y+3.5);
    if(l===L-1) nctx.fillText('输出',p.x,p.y+3.5);
  }));
}

/* ================= 损失曲线 ================= */
const lossCv=document.getElementById('lossCanvas'), lctx=lossCv.getContext('2d');
function drawLoss(){
  const dpr=window.devicePixelRatio||1;
  const w=lossCv.clientWidth,h=96;
  if(lossCv.width!==Math.round(w*dpr)){lossCv.width=w*dpr; lossCv.height=h*dpr;}
  lctx.setTransform(dpr,0,0,dpr,0,0);
  lctx.clearRect(0,0,w,h);
  lctx.strokeStyle='#e6e9f2'; lctx.strokeRect(0.5,0.5,w-1,h-1);
  const plot=(hist,color)=>{
    if(hist.length<2)return;
    const max=Math.max(...hist,0.1);
    lctx.beginPath(); lctx.lineWidth=1.8; lctx.strokeStyle=color;
    hist.forEach((v,i)=>{
      const x=i/(Math.max(hist.length,200)-1)*(w-4)+2, y=h-4-(v/max)*(h-10);
      i?lctx.lineTo(x,y):lctx.moveTo(x,y);
    });
    lctx.stroke();
  };
  plot(state.trainHist,`rgb(${C_BLUE})`);
  plot(state.testHist,`rgb(${C_ORANGE})`);
}

/* ================= 录屏回放 ================= */
const frames=[], MAX_FRAMES=300;
let replaying=false, replayTimer=null;
const replayBtn=document.getElementById('replayBtn');

function recordFrame(tl,te){
  frames.push({epoch:state.epoch, tl, te, img:offCtx.getImageData(0,0,GRID,GRID)});
  if(frames.length>MAX_FRAMES) frames.shift();
  const sl=document.getElementById('replaySlider');
  sl.max=frames.length-1; sl.disabled=frames.length<2;
  document.getElementById('replayInfo').textContent=`已录 ${frames.length} 帧（最新：第 ${state.epoch} 轮）`;
}
function showFrame(i){
  const f=frames[i]; if(!f) return;
  offCtx.putImageData(f.img,0,0);
  octx.imageSmoothingEnabled=true;
  octx.drawImage(off,0,0,outCv.width,outCv.height);
  drawPoints(octx,outCv.width);
  document.getElementById('epoch').textContent=f.epoch.toLocaleString();
  document.getElementById('trainLoss').textContent=f.tl.toFixed(4);
  document.getElementById('testLoss').textContent=f.te.toFixed(4);
  document.getElementById('replaySlider').value=i;
  document.getElementById('replayInfo').textContent=`回放：第 ${f.epoch} 轮（${i+1}/${frames.length} 帧）`;
}
function stopReplay(){
  replaying=false;
  clearInterval(replayTimer); replayTimer=null;
  replayBtn.textContent='▶ 回放训练过程';
  document.getElementById('replayInfo').textContent=frames.length?`已录 ${frames.length} 帧`:'每 20 轮存一帧';
}
replayBtn.onclick=()=>{
  if(replaying){ stopReplay(); return; }
  if(frames.length<2) return;
  if(state.playing) playBtn.onclick();
  replaying=true; replayBtn.textContent='⏹ 停止回放';
  let i=0; showFrame(0);
  replayTimer=setInterval(()=>{ i++; if(i>=frames.length){stopReplay();return;} showFrame(i); },150);
};
document.getElementById('replaySlider').oninput=e=>{
  if(state.playing) playBtn.onclick();
  if(replayTimer){ clearInterval(replayTimer); replayTimer=null; }
  replaying=true; replayBtn.textContent='⏹ 停止回放';
  showFrame(+e.target.value);
};
function clearFrames(){
  frames.length=0; stopReplay();
  const sl=document.getElementById('replaySlider');
  sl.max=0; sl.value=0; sl.disabled=true;
  document.getElementById('replayInfo').textContent='每 20 轮存一帧';
}

/* ================= 主循环 ================= */
let frame=0;
function tick(){
  if(state.playing && !replaying){ trainStep(); trainStep(); }
  if(!replaying && frame%2===0) drawOutput();
  drawNetwork();
  if(frame%10===0 && !replaying){
    const tl=lossOf(state.train), te=lossOf(state.test);
    state.trainHist.push(tl); state.testHist.push(te);
    if(state.trainHist.length>300){state.trainHist.shift(); state.testHist.shift();}
    if(state.playing && state.epoch%20===0) recordFrame(tl,te);
    document.getElementById('epoch').textContent=state.epoch.toLocaleString();
    document.getElementById('trainLoss').textContent=tl.toFixed(4);
    document.getElementById('testLoss').textContent=te.toFixed(4);
    drawLoss();
  }
  frame++;
  requestAnimationFrame(tick);
}

/* ================= UI 构建 ================= */
function buildDatasetUI(){
  const grid=document.getElementById('dsGrid'); grid.innerHTML='';
  for(const key of Object.keys(DATAS)){
    const btn=document.createElement('button');
    btn.className='ds-btn'+(key===state.dataset?' active':'');
    const cv=document.createElement('canvas'); cv.width=cv.height=72;
    const c2=cv.getContext('2d');
    for(let i=0;i<140;i++){
      const p=DATAS[key].gen();
      c2.beginPath(); c2.arc((p.x+DOMAIN)/12*72,72-(p.y+DOMAIN)/12*72,1.8,0,7);
      c2.fillStyle=p.y0?`rgb(${C_ORANGE})`:`rgb(${C_BLUE})`; c2.fill();
    }
    const sp=document.createElement('span'); sp.textContent=DATAS[key].name;
    btn.append(cv,sp);
    btn.onclick=()=>{state.dataset=key; genData(); resetNetwork(); buildDatasetUI();};
    grid.appendChild(btn);
  }
}

// 特征方块：缩略图直接画该特征在全定义域的取值渐变（对齐原版）
function featThumb(k){
  const cv=document.createElement('canvas'); cv.width=cv.height=44;
  const c=cv.getContext('2d'), img=c.createImageData(44,44);
  for(let gy=0;gy<44;gy++)for(let gx=0;gx<44;gx++){
    const x=(gx/43)*2*DOMAIN-DOMAIN, y=DOMAIN-(gy/43)*2*DOMAIN;
    let v=FEATS[k].f(x,y); v=Math.max(-1,Math.min(1,v));
    const t=Math.abs(v), base=v<0?C_ORANGE:C_BLUE;
    const o=(gy*44+gx)*4;
    img.data[o]=255+(base[0]-255)*t; img.data[o+1]=255+(base[1]-255)*t;
    img.data[o+2]=255+(base[2]-255)*t; img.data[o+3]=255;
  }
  c.putImageData(img,0,0);
  return cv;
}
function buildFeatUI(){
  const box=document.getElementById('featGrid'); box.innerHTML='';
  for(const k of Object.keys(FEATS)){
    const on=state.features.includes(k);
    const d=document.createElement('div');
    d.className='feat'+(on?' active':'');
    d.appendChild(featThumb(k));
    const sp=document.createElement('span'); sp.textContent=FEATS[k].label;
    const pm=document.createElement('i'); pm.className='pm'; pm.textContent=on?'−':'＋';
    d.append(pm,sp);
    d.onclick=()=>{
      const i=state.features.indexOf(k);
      if(i>=0){ if(state.features.length>1) state.features.splice(i,1); }
      else state.features.push(k);
      resetNetwork(); buildFeatUI();
    };
    box.appendChild(d);
  }
  document.getElementById('featCnt').textContent=`已选 ${state.features.length}/7`;
}

function buildLayerUI(){
  const box=document.getElementById('layersBox'); box.innerHTML='';
  document.getElementById('hlCnt').textContent=state.hidden.length;
  state.hidden.forEach((n,idx)=>{
    const d=document.createElement('div'); d.className='hlayer';
    const nn=document.createElement('span'); nn.className='n'; nn.textContent=n;
    const rb=document.createElement('div'); rb.className='rowb';
    const minus=document.createElement('button'); minus.className='pm2'; minus.textContent='−';
    const plus=document.createElement('button'); plus.className='pm2'; plus.textContent='＋';
    const del=document.createElement('button'); del.className='pm2 del'; del.textContent='×'; del.title='删除本层';
    minus.onclick=()=>{ if(n>1){state.hidden[idx]--; resetNetwork(); buildLayerUI();} };
    plus.onclick =()=>{ if(n<8){state.hidden[idx]++; resetNetwork(); buildLayerUI();} };
    del.onclick  =()=>{ state.hidden.splice(idx,1); resetNetwork(); buildLayerUI(); };
    rb.append(minus,plus,del);
    d.append(nn,rb);
    box.appendChild(d);
  });
  document.getElementById('addLayer').style.display=state.hidden.length>=3?'none':'block';
}
document.getElementById('addLayer').onclick=()=>{
  if(state.hidden.length<3){ state.hidden.push(3); resetNetwork(); buildLayerUI(); }
};

/* ================= 控件绑定 ================= */
const playBtn=document.getElementById('playBtn');
playBtn.onclick=()=>{
  if(replaying) stopReplay();
  state.playing=!state.playing;
  playBtn.textContent=state.playing?'⏸':'▶';
  playBtn.classList.toggle('pause',state.playing);
};
document.getElementById('resetBtn').onclick=()=>{ resetNetwork(); clearFrames(); };
document.getElementById('regenBtn').onclick=()=>genData();
document.getElementById('lr').onchange=e=>state.lr=+e.target.value;
document.getElementById('act').onchange=e=>{ state.act=e.target.value; resetNetwork(); };
document.getElementById('reg').onchange=e=>state.reg=e.target.value;
document.getElementById('regRate').onchange=e=>state.regRate=+e.target.value;
document.getElementById('problem').onchange=e=>{ state.problem=e.target.value; resetNetwork(); clearFrames(); };
document.getElementById('showTest').onchange=e=>state.showTest=e.target.checked;
document.getElementById('discretize').onchange=e=>state.discretize=e.target.checked;
document.getElementById('noise').oninput=e=>{
  state.noise=+e.target.value;
  document.getElementById('noiseVal').textContent=state.noise; genData();
};
document.getElementById('batch').oninput=e=>{
  state.batch=+e.target.value;
  document.getElementById('batchVal').textContent=state.batch;
};
document.getElementById('ratio').oninput=e=>{
  state.ratio=+e.target.value/100;
  document.getElementById('ratioVal').textContent=e.target.value+'%';
  genData();
};

/* ================= 导出 / 分享 ================= */
function modelData(){
  return {dataset:state.dataset, features:state.features, hidden:state.hidden,
          act:state.act, lr:state.lr, batch:state.batch, reg:state.reg, regRate:state.regRate,
          problem:state.problem, W:state.W, b:state.b, epoch:state.epoch};
}
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(modelData())],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`nn-${state.dataset}-${state.epoch}轮.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('shareBtn').onclick=async()=>{
  const d=modelData();
  d.W=d.W.map(M=>M.map(r=>r.map(v=>+v.toFixed(4))));
  d.b=d.b.map(v=>v.map(x=>+x.toFixed(4)));
  const url=location.origin+location.pathname+'#'+encodeURIComponent(JSON.stringify(d));
  try{ await navigator.clipboard.writeText(url); alert('链接已复制！发给别人即可打开同款训练好的模型'); }
  catch(e){ prompt('复制这个链接：', url); }
};
function loadFromHash(){
  if(location.hash.length<10) return false;
  try{
    const d=JSON.parse(decodeURIComponent(location.hash.slice(1)));
    Object.assign(state,{dataset:d.dataset, features:d.features, hidden:d.hidden,
      act:d.act, lr:d.lr, batch:d.batch, reg:d.reg||'none', regRate:d.regRate||0,
      problem:d.problem||'classification', epoch:d.epoch||0});
    genData();
    state.W=d.W; state.b=d.b;
    document.getElementById('lr').value=d.lr;
    document.getElementById('act').value=d.act;
    document.getElementById('batch').value=d.batch;
    document.getElementById('batchVal').textContent=d.batch;
    document.getElementById('reg').value=state.reg;
    document.getElementById('regRate').value=String(state.regRate);
    document.getElementById('problem').value=state.problem;
    return true;
  }catch(e){ return false; }
}

/* ================= 启动 ================= */
if(!loadFromHash()){ genData(); resetNetwork(); }
buildDatasetUI(); buildFeatUI(); buildLayerUI();
tick();
</script>
